workflows:
  android-apk-build:
    name: Build Android APK
    instance_type: mac_mini_m1
    max_build_duration: 30
    scripts:
      - name: Set up Gradle Wrapper
        script: gradle wrapper --gradle-version 8.5
      - name: Build Android APK
        script: ./gradlew assembleDebug --stacktrace
    artifacts:
      - app/build/outputs/apk/**/*.apk
